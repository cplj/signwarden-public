openapi: 3.1.0
info:
  title: SignWarden local report API
  version: 0.1.0
  description: Trusted loopback clients only. The operator selects executable adapter code at startup. No adapter sandbox, execution deadline, authentication or deduplication.
  contact:
    name: SignWarden Team
    email: security@signwarden.com
servers:
  - url: http://127.0.0.1:8765
paths:
  /report:
    post:
      operationId: createReport
      summary: Run a suite against the fixed trusted adapter
      description: Body limit 1048576 bytes; socket read timeout 10 seconds. Host must be exactly 127.0.0.1:PORT and Origin must be absent. Each request executes adapter code. HTTP 200 does not imply PASS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './docs/schemas/suite.schema.json'
      responses:
        '200':
          description: A full PASS, FAIL or UNKNOWN report
          content:
            application/json:
              schema:
                $ref: './docs/schemas/report.schema.json#/oneOf/0'
        '400':
          description: Invalid input, media type, length, setup or execution error
          content:
            application/json:
              schema:
                $ref: './docs/schemas/report.schema.json#/oneOf/1'
        '403':
          description: Origin or Host rejected
          content:
            application/json:
              schema:
                $ref: './docs/schemas/report.schema.json#/oneOf/1'
        '404':
          description: Unknown path
        '405':
          description: GET is unsupported
