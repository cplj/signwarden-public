[build-system]
requires = ["setuptools>=79"]
build-backend = "setuptools.build_meta"

[project]
name = "signwarden"
version = "0.1.0"
description = "Permission and action regression checks for AI agents, run locally or in CI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "SignWarden Team", email = "security@signwarden.com"}]
requires-python = ">=3.10"
dependencies = []


[project.scripts]
signwarden = "signwarden.__main__:main"

[tool.setuptools]
packages = ["signwarden"]
